# Builds the JupyterLite site (notebooks/figures.ipynb with the public data) and publishes it on GitHub Pages:
# https://neuroenergeticslab.github.io/synthCMRO2/lab/index.html?path=figures.ipynb
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
name: JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JupyterLite
        run: pip install -r lite/requirements.txt build
      - name: Build the synthcmro2 wheel (installed in the browser by the notebook)
        run: python -m build --wheel --outdir lite/pypi
      - name: Collect the notebook and the public data
        run: |
          mkdir -p _content/config _content/data
          cp notebooks/figures.ipynb _content/
          cp config/figures.yaml _content/config/
          cp -r data/public data/brain _content/data/
          cp -r reference _content/
      - name: Build the site
        run: jupyter lite build --lite-dir lite --contents _content --output-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
