# Figures from the INDIVIDUAL tables of `synthcmro2 model export` (needs the participants' data; not public).
# The public repository uses config/figures.yaml, which reads the shareable tables in data/public/.
# `synthcmro2 public-tables --config config/figures_individual.yaml --exclude-parcels ... --out data/public`
# writes those tables from the individual ones, following the `public` section at the end of this file.
# All paths are relative to the project root (the parent of config/) unless absolute.

paths:
  # Read straight from the model part's output: `synthcmro2 model export --tag <tag>` writes the tables to
  # results/export/, and `synthcmro2 pls` writes the PLS results to pls_dir. {tag} is replaced by `tag` below
  # (or by --tag on the command line), so a new export only needs a new tag here.
  tag: "20261107"
  participant_metrics: results/export/synthcmro2_stats_df_{tag}.csv
  voxel_values: results/export/cmro2_vox_df_{tag}.csv
  retest_voxel_values: results/export/cmro2_vox_df_{tag}_test_retest.csv   # Figure S2; empty = skip it
  pls_dir: results/pls_{tag}                 # written by `synthcmro2 pls`, read by `synthcmro2 figures`
  output_dir: results/manuscript_{tag}       # figures/, stats/ (incl. Table S2), run.log, provenance.json

  # Gray matter mask that defines vox_id (NiftiMasker order). Needed to draw
  # brain slices (Figure 3b) and surfaces; without it, Figure 3b shows the
  # overlap statistics only.
  gm_mask: data/brain/task-all_space-MNI152NLin2009cAsym_res-4_SNR_YEO_group_mask.nii.gz
  brain_background: data/brain/tpl-MNI152NLin2009cAsym_res-04_desc-bet_T1w.nii  # empty = nilearn MNI152

  # Optional inputs for the cortical surface panels (Figures 2 and 4).
  # Cortical surface maps (left hemisphere). Leave empty to omit the maps.
  surface:
    glasser_atlas: data/brain/atlas-MMPGlasser2016_space-MNI152NLin2009cAsym_res-4mm_desc-cropped.nii.gz  # last y slice removed (synthcmro2 crop-atlas)
    glasser_label_gii: data/brain/Glasser_2016.32k.L.label.gii
    inflated_surf_gii: data/brain/fs_LR.32k.L.inflated.surf.gii

# Dataset identifiers in the tables (as written by synthcmro2 model export), by role in the figures.
datasets:
  test: test_set                    # main cohort test set, Young-adults I/II and Older-adults I/II
  task: calculation                 # calculation task, Young-adults I test participants
  fmri: fmri_subset                 # resting-state fMRI subset of the test set
  replication: replication          # same vendor and protocol
  reproducibility: reproducibility  # different vendor and protocol
  retest: test_retest               # second within-session scan of Young-adults II test participants (Fig. S2)
  calibration: training_oof         # out-of-fold predictions of the training participants (Fig. 4b age calibration)

dataset_labels:
  test_set: test set
  calculation: calculation
  fmri_subset: test set (fMRI subset)
  replication: Same-protocol dataset
  reproducibility: Cross-vendor dataset

# Model identifiers as stored in the CSV files (keys) and manuscript labels (values),
# in the order they are shown in the figures.
models:
  reference: full
  wo CBV: without CBV
  CBF & T2*: CBF&T2*
  CBF: CBF
  T1: T1-weighted
  fMRI: fMRI

minimal_model: CBF & T2*
# Single-input models compared against the CBF model (Results, anatomical/functional).
alternative_input_models: [T1, fMRI]
alternative_input_baseline: CBF

# Mean-centered PLS of calculation versus rest (Figure 3b).
pls:
  file_pattern: "N10_PLS_cmro2_median_res-4_calcrest_GMmask_{tag}.npy"
  analytical_tag: ORIGINAL
  model_tags:                # models shown in Figure 3b, in order
    reference: OmitT1
    wo CBV: OmitCBV_OmitT1
    CBF & T2*: OmitCBV_OmitT2_OmitT1
    CBF: OmitCBV_OmitT2_OmitT2S_OmitT1
  latent_variable: 0         # first LV
  bsr_threshold: 2           # |bootstrap ratio| > 2
  bsr_limit: 7               # color scale limits (± BSR)
  slice_z: 15                # axial slice (mm, MNI)
  task: calc
  baseline: rest

metrics:
  r: Pearson r
  slope: slope
  MAE: MAE (µmol/100 g/min)

analysis:
  random_seed: 1234
  n_bootstrap: 2000          # BCa bootstrap resamples for group-level r
  ci_level: 0.95
  positive_values_only: true # drop voxels with CMRO2 <= 0 or synthetic CMRO2 <= 0
  group_summary: median      # voxel-wise summary across participants for group maps
  sd_ddof: 1                 # sample SD for paired differences
  # Fig. 4b: subtract from each test participant's synthetic CMRO2 the model error expected at their age,
  # fitted (error = a + b x age) in out-of-fold predictions of the training participants (dataset role
  # 'calibration'); uses no analytical CMRO2 of the test participants. age_plot selects the plotted values.
  # fig4b_age_slopes.csv reports the decline per decade of analytical, synthetic and calibrated CMRO2 either way.
  age_calibration: true
  age_plot: synthetic          # Fig. 4b right panel: synthetic (uncorrected) or calibrated
  # Sensitivity analysis: Glasser parcels removed in both hemispheres from all voxel-based results, e.g.
  # [TE1m, TE2a, TE1p, TE2p, a10p, 11l]: inferior temporal parcels next to the petrous bone and frontal-pole/
  # orbitofrontal parcels next to the frontal sinus, with outlying CMRO2 (strong susceptibility effects).
  # Participant metrics are recomputed from the remaining voxels; outputs go to <output_dir>_excl-<names>.
  # Usually left empty here and set per run: synthcmro2 figures --exclude-parcels TE1m TE2a TE1p TE2p a10p 11l
  exclude_parcels: []

# Test-retest reliability across Glasser parcels (Figure S2): ICC(2,1) of participant-wise parcel medians
# between the two within-session scans, for analytical CMRO2 and each model.
reliability:
  min_parcel_voxels: 5       # mask voxels needed for a parcel median (as for Table S2 and the surface maps)
  ylim: [0.1, 1.1]
  bands: [0.5, 0.75, 0.9]    # Koo & Li (2016): moderate, good, excellent

plotting:
  font_family: DejaVu Sans
  font_size: 8
  dpi: 300                   # PNG resolution; --dpi overrides; null = Matplotlib default (100)
  formats: [pdf, png, svg]
  scatter_point_size: 1
  scatter_color: "#666666"
  line_color: black
  condition_colors:          # light = reference condition, dark = comparison
    light: "#bdbdbd"
    dark: "#636363"
  significance_color: "#d9534f"
  axis_limits:
    test: [0, 400]
    task: [0, 600]
    replication: [0, 400]
    reproducibility: [0, 600]
  units: "µmol/100 g/min"
  surface:
    cmap: magma
    cmap_range: [0.25, 1.0]  # drop the near-black end of the colormap
    percentiles: [10, 90]    # color limits from the analytical parcels, shared with synthetic maps
    ambient: 0.75            # shading: 1 = flat, lower = stronger relief
    medial_view: true        # Fig. 2a: medial view of the analytical map below the lateral one
    # Parcels the gray matter mask barely covers are drawn gray, like the medial wall
    min_coverage: 0.25       # fraction of the parcel's atlas voxels inside the mask
    min_voxels: 5            # mask voxels needed for a parcel median

# Rules of `synthcmro2 public-tables` (shareable tables, see src/synthcmro2/figures/public.py)
public:
  cohorts:                    # source dataset of each participant, by participant ID (Table 1)
    Young-adults I: "^sub-p0[0-9]{2}$"
    Young-adults II: "^sub-stab[0-9]+$"
    Older-adults I: "^sub-p1[0-9]{2}$"
    Older-adults II: "^sub-p2[0-9]{2}$"
    Same-protocol: "_eunat$"
    Cross-vendor: "^sub-fp[0-9]+$"
  # age shared only for the test-set participants of these cohorts (age-related decline, Fig. 4b, Table S4)
  age_withheld: [Older-adults I, Older-adults II, Cross-vendor]
  # participant rows not shared: out-of-fold training predictions (only the fitted age calibration is shared)
  # and the second within-session scans (only the parcel ICCs are shared)
  drop_datasets: [training_oof, test_retest]
